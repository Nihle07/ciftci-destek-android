plugins {

    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services' //ekledim

}

// Local Maps configuration for GitHub distribution.
def localSecrets = new Properties()
def localSecretsFile = rootProject.file('local.properties')
if (localSecretsFile.exists()) {
    localSecretsFile.withInputStream { localSecrets.load(it) }
}

android {
    namespace 'com.example.tarimmobilprojesi'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        manifestPlaceholders = [MAPS_API_KEY: localSecrets.getProperty('MAPS_API_KEY', '')]
        applicationId "com.example.tarimmobilprojesi"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation 'com.google.android.gms:play-services-maps:18.2.0' //ekledim
    implementation 'com.google.android.gms:play-services-location:21.3.0' //ekledim

    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit

    implementation platform('com.google.firebase:firebase-bom:34.13.0') //Ekledim
    implementation ('com.google.firebase:firebase-firestore')  //ekledim
    implementation("com.google.firebase:firebase-auth")

}